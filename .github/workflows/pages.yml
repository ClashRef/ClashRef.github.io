name: Publish Clash Ref

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clashref-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage static site
        run: |
          mkdir _site
          cp index.html app.js analytics.js style.css sw.js .nojekyll _site/
          cp -R data _site/data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes can't find the just-uploaded artifact ("No artifacts named
      # github-pages"). Wait and try once more before failing the run.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
